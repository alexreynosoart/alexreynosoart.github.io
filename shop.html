<!DOCTYPE html>

<head>

    <title>Shop | Alex Reynoso Art</title>

    <meta name="description"

    <style>
        * {
            box-sizing: border-box;

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;

        header {

        }

        nav a:hover {
            text-decoration: underline;
        }

        .page {

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 25px;
        }

        .page h1 {
            font-size: clamp(48px, 8vw, 80px);
            margin: 0 0 15px;
        }

        .page p {
            max-width: 600px;
            color: #bbb;
            font-size: 18px;
            line-height: 1.6;
            margin: 0;
        }

        .coming-soon {
            margin-top: 35px;
            padding: 12px 22px;
            border: 1px solid #444;
            color: #aaa;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
