name: Test Rule of Three Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test three official calendars (read-only)
        run: python scripts/rule_of_three_source_preview.py
      - name: Verify event cache unchanged
        run: git diff --exit-code -- data/art-events.json
