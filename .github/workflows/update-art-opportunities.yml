name: Everything Art Opportunity Engine
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-opportunities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current opportunities
        run: python scripts/collect_art_opportunities.py
      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Everything Art opportunities"
            git push
          fi
