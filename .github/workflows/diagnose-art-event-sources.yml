name: Diagnose Everything Art Event Sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect MoMA, Guggenheim and NYPL event data
        run: python scripts/diagnose_art_event_sources.py
