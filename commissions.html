<style>

    /* Commissions background */

    body {
        position: relative;
        min-height: 100vh;
        background: #111;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
            url("images/commissions-background-alex-reynoso-art.jpg");
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        opacity: 0.05;
        pointer-events: none;
        z-index: 0;
    }

    header,
    main,
    footer {
        position: relative;
        z-index: 1;
    }


    /* Commission introduction */

    .commission-intro {
        max-width: 760px;
        margin: 90px auto 85px;
        padding: 0 24px;
        text-align: center;
    }

    .commission-intro h1 {
        margin: 0 0 22px;
        font-size: clamp(3rem, 7vw, 5rem);
        line-height: 1;
    }

    .commission-intro p {
        max-width: 650px;
        margin: 0 auto;
        color: #ccc;
        font-size: 1rem;
        line-height: 1.7;
    }


    /* Commission board */

    .commission-board {
        width: min(1100px, calc(100% - 48px));
        margin: 0 auto 110px;
    }

    .commission-board-heading {
        margin-bottom: 28px;
    }

    .commission-board-heading h2 {
        margin: 0 0 8px;
        font-size: 2rem;
    }

    .commission-board-heading p {
        margin: 0;
        color: #999;
        line-height: 1.6;
    }

    .commission-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }


    /* Commission cards */

    .commission-card {
        min-height: 175px;
        padding: 20px;
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 20px;
        align-items: start;
        background: rgba(17, 17, 17, 0.94);
        border: 1px solid #333;
    }

    .commission-thumbnail {
        width: 110px;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.035),
                rgba(255,255,255,0.008)
            );
        border: 1px solid #333;
    }

    .commission-thumbnail::before {
        content: "IMAGE";
        color: #555;
        font-size: 0.58rem;
        letter-spacing: 0.18em;
    }

    .commission-thumbnail:has(img)::before {
        display: none;
    }

    .commission-thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .commission-card-content {
        min-width: 0;
        min-height: 135px;
        padding: 0;
        display: flex;
        flex-direction: column;
    }

    .commission-number {
        display: block;
        margin-bottom: 20px;
        color: #777;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
    }

    .commission-card h3 {
        margin: 0 0 8px;
        font-size: 1.15rem;
    }

    .commission-card p {
        margin: 0;
        color: #999;
        font-size: 0.84rem;
        line-height: 1.5;
    }

    .commission-status {
        display: inline-block;
        margin-top: auto;
        padding-top: 16px;
        color: #f4c430;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }

    .commission-status.completed {
        color: #aaa;
    }


    /* Permanent open slot */

    .commission-card-next {
        min-height: 175px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px dashed #444;
        background: rgba(17, 17, 17, 0.74);
    }

    .commission-card-next .commission-number {
        margin-bottom: 20px;
    }

    .commission-card-next h3 {
        margin: 0 0 8px;
        color: #f4c430;
        font-size: 1.15rem;
    }

    .commission-card-next p {
        margin: 0;
        color: #999;
        font-size: 0.84rem;
        line-height: 1.5;
    }

    .commission-card-next .commission-status {
        margin-top: auto;
    }


    @media (max-width: 750px) {

        .commission-grid {
            grid-template-columns: 1fr;
        }

    }

    @media (max-width: 600px) {

        body::before {
            background-position: center center;
        }

        .commission-intro {
            margin: 65px auto 65px;
        }

        .commission-board {
            width: min(100% - 32px, 1100px);
            margin-bottom: 80px;
        }

        .commission-card {
            grid-template-columns: 82px 1fr;
            gap: 16px;
            min-height: 150px;
            padding: 16px;
        }

        .commission-thumbnail {
            width: 82px;
        }

        .commission-card-content {
            min-height: 118px;
        }

        .commission-card-next {
            min-height: 150px;
            padding: 18px;
        }

    }

</style>
