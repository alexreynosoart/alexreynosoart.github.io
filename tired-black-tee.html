<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tired. Unisex Classic Tee | Alex Reynoso Art</title>

    <meta name="description"
          content="Tired. black type unisex classic tee by Alex Reynoso Art.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            margin: 0 0 20px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 22px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .product {
            max-width: 1100px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .product-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .product-header h1 {
            margin: 0 0 12px;
            font-size: clamp(32px, 5vw, 54px);
        }

        .product-header p {
            margin: 8px 0;
        }

        .price {
            color: #ccc;
            font-size: 22px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 50px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }

        .product-info {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        .product-info p {
            color: #ccc;
            font-size: 18px;
            line-height: 1.6;
        }

        .buy-button {
            display: inline-block;
            margin-top: 15px;
            padding: 15px 30px;
            background: #fff;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }

        .buy-button:hover {
            opacity: 0.85;
        }

        .video-section {
            margin-top: 60px;
            text-align: center;
        }

        .video-section h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .product-video {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            border-radius: 8px;
            background: #000;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            color: #ccc;
            text-decoration: none;
            margin: 0 12px;
        }

        .social-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .back-shop {
            margin-top: 60px;
            text-align: center;
        }

        .back-shop a {
            color: #aaa;
            text-decoration: none;
        }

        .back-shop a:hover {
            color: #fff;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 42px;
            cursor: pointer;
            line-height: 1;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 750px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .product {
                margin-top: 20px;
            }

            .social-links {
                display: flex;
                justify-content: center;
                gap: 24px;
                flex-wrap: wrap;
            }

            .social-links a {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">Alex Reynoso Art</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="art.html">Art</a>
            <a href="videos.html">Videos</a>
            <a href="shop.html">Shop</a>
            <a href="commissions.html">Commissions</a>
        </nav>

    </header>

    <main class="product">

        <div class="product-header">
            <h1>Tired.</h1>
            <p>Black Type Unisex Classic Tee</p>
            <p class="price">$12.50</p>
        </div>

        <div class="gallery">

            <img src="images/unisex-classic-tee-white-front-6aaa23d525564.jpg"
                 alt="Tired. classic tee on hanger">

            <img src="images/unisex-classic-tee-white-front-6aaa23d525adf.jpg"
                 alt="Model wearing Tired. classic tee">

            <img src="images/unisex-classic-tee-white-front-6aaa23d5258a4.jpg"
                 alt="Tired. classic tee product view">

        </div>

        <div class="product-info">

            <p>Tired. Enough said.</p>

            <a class="buy-button"
               href="https://alexreynosoart.printful.me/product/tired-black-type-unisex-classic-tee-6aa306754fdc4"
               target="_blank"
               rel="noopener">
                BUY ON PRINTFUL
            </a>

        </div>

        <section class="video-section">

            <h2>Watch Tired. in action</h2>

            <video
                class="product-video"
                controls
                playsinline
                preload="metadata"
                poster="images/unisex-classic-tee-white-front-6aaa23d525564.jpg">

                <source
                    src="images/tired-black-type-unisex-classic-tee-white.mp4"
                    type="video/mp4">

                Your browser does not support video playback.
            </video>

            <div class="social-links">

                <a href="https://www.instagram.com/p/DdSpbELxJVm/"
                   target="_blank"
                   rel="noopener">
                    Watch on Instagram
                </a>

                <a href="https://www.tiktok.com/@alexreynosoart/video/7685580681946156319?lang=en"
                   target="_blank"
                   rel="noopener">
                    Watch on TikTok
                </a>

            </div>

        </section>

        <div class="back-shop">
            <a href="shop.html">← Back to Shop</a>
        </div>

    </main>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-image" src="" alt="Enlarged product image">
    </div>

    <footer>
        &copy; 2026 Alex Reynoso Art
    </footer>

    <script>
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");
        const galleryImages = document.querySelectorAll(".gallery img");
        const closeButton = document.querySelector(".lightbox-close");

        galleryImages.forEach(function(image) {
            image.addEventListener("click", function() {
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt;
                lightbox.classList.add("active");
            });
        });

        closeButton.addEventListener("click", function() {
            lightbox.classList.remove("active");
        });

        lightbox.addEventListener("click", function(event) {
            if (event.target === lightbox) {
                lightbox.classList.remove("active");
            }
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                lightbox.classList.remove("active");
            }
        });
    </script>

</body>

</html>
