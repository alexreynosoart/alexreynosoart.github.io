<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MK5FXXVXNJ"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-MK5FXXVXNJ');

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">


    <title>Color Studio | Mia the Panda</title>


    <meta name="description"
          content="A creative online coloring studio from Mia the Panda and Alex Reynoso Art.">


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {
            background: #f8f5f7;
            color: #222;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overscroll-behavior: none;
        }


        button,
        input {
            font: inherit;
        }


        /* =========================
           STUDIO SHELL
           ========================= */

        .studio {
            max-width: 1450px;
            margin: 0 auto;
            padding: 14px 18px 40px;
        }


        /* TOP BAR */

        .studio-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            min-height: 58px;
            margin-bottom: 12px;
        }


        .exit-studio {
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
        }


        .exit-studio:hover {
            color: #e07f9f;
        }


        .studio-name {
            text-align: center;
        }


        .studio-name strong {
            display: block;
            font-size: 1rem;
        }


        .studio-name span {
            display: block;
            margin-top: 2px;

            color: #888;
            font-size: 0.68rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }


        .studio-heart {
            color: #e88eaa;
        }


        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }


        .zoom-button {
            min-width: 42px;
            min-height: 40px;

            border: 1px solid #ccc;
            border-radius: 9px;

            background: #fff;
            color: #222;

            font-weight: 700;
            cursor: pointer;
        }


        .zoom-button:hover {
            background: #111;
            border-color: #111;
            color: #fff;
        }


        .zoom-readout {
            min-width: 56px;
            text-align: center;
            color: #666;
            font-size: 0.78rem;
            font-weight: 700;
        }


        /* =========================
           WORKSPACE
           ========================= */

        .workspace {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }


        /* =========================
           DESKTOP TOOLBOX
           ========================= */

        .toolbox {
            background: #fff;

            border:
                1px solid
                rgba(0,0,0,0.08);

            border-radius: 18px;

            padding: 16px;

            position: sticky;
            top: 12px;
        }


        .tool-section {
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid #eee;
        }


        .tool-section:last-child {
            margin: 0;
            padding: 0;
            border-bottom: 0;
        }


        .tool-label {
            display: block;

            margin-bottom: 9px;

            color: #666;

            font-size: 0.7rem;
            font-weight: 700;

            letter-spacing: 0.1em;
            text-transform: uppercase;
        }


        .tool-buttons {
            display: grid;
            gap: 7px;
        }


        .tool-button {
            min-height: 42px;

            border: 1px solid #ddd;
            border-radius: 9px;

            background: #fff;
            color: #222;

            font-size: 0.8rem;
            font-weight: 700;

            cursor: pointer;
        }


        .tool-button.active {
            background: #111;
            border-color: #111;
            color: #fff;
        }


        /* =========================
           PALETTE
           ========================= */

        .palette {
            display: grid;
            grid-template-columns:
                repeat(5, 1fr);

            gap: 7px;
        }


        .swatch {
            aspect-ratio: 1;

            min-width: 30px;

            border-radius: 50%;

            border: 2px solid #fff;

            outline:
                1px solid #ccc;

            cursor: pointer;
        }


        .swatch.selected {
            outline:
                3px solid #222;
        }


        .custom-color {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-top: 12px;

            color: #666;
            font-size: 0.75rem;
        }


        .custom-color input {
            width: 42px;
            height: 36px;

            border: 0;
            padding: 0;

            background: transparent;
        }


        .brush-slider {
            width: 100%;
        }


        .brush-readout {
            margin-top: 5px;

            text-align: center;

            color: #777;

            font-size: 0.72rem;
        }


        /* =========================
           ART SIDE
           ========================= */

        .art-side {
            min-width: 0;
        }


        .canvas-frame {
            position: relative;

            height:
                min(
                    74vh,
                    900px
                );

            min-height: 500px;

            overflow: hidden;

            background: #ddd;

            border:
                1px solid
                rgba(0,0,0,0.1);

            border-radius: 20px;

            touch-action: none;
        }


        .canvas-stage {
            position: absolute;

            left: 50%;
            top: 50%;

            transform-origin:
                center center;

            background: #fff;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,0.12);

            touch-action: none;
        }


        #paintCanvas,
        #lineCanvas {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;
        }


        #paintCanvas {
            z-index: 2;
        }


        #lineCanvas {
            z-index: 3;
            pointer-events: none;
        }


        .paper-background {
            position: absolute;

            inset: 0;

            z-index: 1;

            background: #fff;

            pointer-events: none;
        }


        /* =========================
           STATUS
           ========================= */

        .studio-status {
            margin: 9px 0 0;

            text-align: center;

            color: #777;

            font-size: 0.75rem;
        }


        /* =========================
           ACTION BAR
           ========================= */

        .action-bar {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;

            margin-top: 10px;
        }


        .action-button {
            min-height: 44px;

            border:
                1px solid #333;

            border-radius: 10px;

            background: #fff;
            color: #222;

            font-size: 0.78rem;
            font-weight: 700;

            cursor: pointer;
        }


        .save-button {
            background: #e88eaa;
            border-color: #e88eaa;
            color: #fff;
        }


        /* =========================
           MOBILE TOOL DOCK
           ========================= */

        .mobile-dock {
            display: none;
        }


        /* =========================
           CREDIT
           ========================= */

        .studio-credit {
            margin-top: 24px;

            text-align: center;

            color: #888;

            font-size: 0.72rem;

            line-height: 1.6;
        }


        /* =========================
           TABLET + MOBILE
           ========================= */

        @media (max-width: 850px) {

            body {
                padding-bottom: 175px;
            }


            .studio {
                padding:
                    8px 8px 25px;
            }


            .studio-topbar {
                min-height: 50px;
                margin-bottom: 7px;
            }


            .studio-name span {
                display: none;
            }


            .workspace {
                display: block;
            }


            .toolbox {
                display: none;
            }


            .canvas-frame {
                height:
                    calc(100vh - 145px);

                min-height: 390px;

                border-radius: 13px;
            }


            .action-bar {
                display: none;
            }


            .studio-status {
                margin-top: 6px;
                font-size: 0.68rem;
            }


            /* MOBILE DOCK */

            .mobile-dock {
                position: fixed;

                left: 0;
                right: 0;
                bottom: 0;

                z-index: 100;

                display: block;

                padding:
                    8px 10px
                    calc(
                        8px +
                        env(
                            safe-area-inset-bottom
                        )
                    );

                background:
                    rgba(
                        255,
                        255,
                        255,
                        0.97
                    );

                border-top:
                    1px solid #ddd;

                backdrop-filter:
                    blur(12px);
            }


            .mobile-palette {
                display: flex;

                gap: 9px;

                overflow-x: auto;

                padding:
                    4px 3px 9px;

                scrollbar-width: none;
            }


            .mobile-palette::-webkit-scrollbar {
                display: none;
            }


            .mobile-palette .swatch {
                flex:
                    0 0 34px;

                width: 34px;
                height: 34px;
            }


            .mobile-tools {
                display: grid;

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 6px;

                margin-bottom: 7px;
            }


            .mobile-actions {
                display: grid;

                grid-template-columns:
                    repeat(4, 1fr);

                gap: 6px;
            }


            .mobile-button {
                min-height: 42px;

                border:
                    1px solid #ccc;

                border-radius: 9px;

                background: #fff;
                color: #222;

                font-size: 0.7rem;
                font-weight: 700;
            }


            .mobile-button.active {
                background: #111;
                border-color: #111;
                color: #fff;
            }


            .mobile-button.save {
                background: #e88eaa;
                border-color: #e88eaa;
                color: #fff;
            }


            .studio-credit {
                display: none;
            }

        }


        @media (max-width: 480px) {

            .studio-name strong {
                font-size: 0.82rem;
            }


            .exit-studio {
                font-size: 0.76rem;
            }


            .zoom-button {
                min-width: 36px;
                min-height: 36px;
            }


            .zoom-readout {
                display: none;
            }

        }

    </style>

</head>


<body>


<div class="studio">


    <!-- =====================
         TOP BAR
         ===================== -->

    <header class="studio-topbar">


        <a class="exit-studio"
           href="mia-coloring.html">
            ← EXIT STUDIO
        </a>


        <div class="studio-name">

            <strong>
                Color Mia<span class="studio-heart">♥</span>
            </strong>

            <span>
                Creative Studio
            </span>

        </div>


        <div class="zoom-controls">

            <button class="zoom-button"
                    id="zoomOut"
                    type="button"
                    aria-label="Zoom out">
                −
            </button>


            <span class="zoom-readout"
                  id="zoomReadout">
                FIT
            </span>


            <button class="zoom-button"
                    id="zoomIn"
                    type="button"
                    aria-label="Zoom in">
                +
            </button>


            <button class="zoom-button"
                    id="fitButton"
                    type="button">
                FIT
            </button>

        </div>


    </header>



    <!-- =====================
         WORKSPACE
         ===================== -->

    <main class="workspace">


        <!-- DESKTOP TOOLS -->

        <aside class="toolbox">


            <div class="tool-section">

                <span class="tool-label">
                    Tools
                </span>


                <div class="tool-buttons">

                    <button class="tool-button active"
                            data-tool="fill"
                            type="button">
                        FILL
                    </button>


                    <button class="tool-button"
                            data-tool="brush"
                            type="button">
                        BRUSH
                    </button>


                    <button class="tool-button"
                            data-tool="eraser"
                            type="button">
                        ERASER
                    </button>

                </div>

            </div>



            <div class="tool-section">

                <span class="tool-label">
                    Colors
                </span>


                <div class="palette desktop-palette">
                </div>


                <label class="custom-color">

                    <input id="customColor"
                           type="color"
                           value="#e88eaa">

                    <span>
                        Pick your own
                    </span>

                </label>

            </div>



            <div class="tool-section">

                <label class="tool-label"
                       for="brushSize">
                    Brush Size
                </label>


                <input class="brush-slider"
                       id="brushSize"
                       type="range"
                       min="3"
                       max="100"
                       value="18">


                <div class="brush-readout">

                    <span id="brushReadout">
                        18
                    </span>

                    px

                </div>

            </div>


        </aside>



        <!-- ART -->

        <section class="art-side">


            <div class="canvas-frame"
                 id="canvasFrame">


                <div class="canvas-stage"
                     id="canvasStage">


                    <div class="paper-background">
                    </div>


                    <canvas id="paintCanvas">
                    </canvas>


                    <canvas id="lineCanvas">
                    </canvas>


                </div>


            </div>


            <p class="studio-status"
               id="studioStatus">
                Fill selected. Tap an area to fill it with color.
            </p>



            <div class="action-bar">


                <button class="action-button"
                        id="undoDesktop"
                        type="button">
                    UNDO
                </button>


                <button class="action-button"
                        id="redoDesktop"
                        type="button">
                    REDO
                </button>


                <button class="action-button"
                        id="resetDesktop"
                        type="button">
                    START OVER
                </button>


                <button class="action-button save-button"
                        id="saveDesktop"
                        type="button">
                    SAVE MY ART
                </button>


            </div>


        </section>


    </main>



    <div class="studio-credit">

        Mia the Panda · Character created by Mia

        <br>

        Developed with Alex Reynoso Art

    </div>


</div>



<!-- =========================
     MOBILE DOCK
     ========================= -->

<div class="mobile-dock">


    <div class="mobile-palette">
    </div>


    <div class="mobile-tools">

        <button class="mobile-button active"
                data-tool="fill"
                type="button">
            FILL
        </button>


        <button class="mobile-button"
                data-tool="brush"
                type="button">
            BRUSH
        </button>


        <button class="mobile-button"
                data-tool="eraser"
                type="button">
            ERASE
        </button>

    </div>


    <div class="mobile-actions">

        <button class="mobile-button"
                id="undoMobile"
                type="button">
            ↶ UNDO
        </button>


        <button class="mobile-button"
                id="redoMobile"
                type="button">
            ↷ REDO
        </button>


        <button class="mobile-button"
                id="resetMobile"
                type="button">
            RESET
        </button>


        <button class="mobile-button save"
                id="saveMobile"
                type="button">
            SAVE
        </button>

    </div>


</div>



<script>

    /* =====================================================
       MIA CREATIVE STUDIO
       =====================================================

       ARTWORK SOURCE
       Change this value later when multiple pages exist.

       A future gallery can call:
       mia-color.html?art=some-id

       The product/API layer should NOT live here.
       Finished artwork is exported through
       createFinishedArtwork().

       ===================================================== */


    const ARTWORK = {

        id:
            'tired-panda-001',

        title:
            'Tired Panda',

        source:
            'images/mia-the-panda-coloring-page.png',

        creator:
            'Mia'

    };


    /* =========================
       CANVAS
       ========================= */


    const paintCanvas =
        document.getElementById(
            'paintCanvas'
        );


    const lineCanvas =
        document.getElementById(
            'lineCanvas'
        );


    const paintCtx =
        paintCanvas.getContext(
            '2d',
            {
                willReadFrequently: true
            }
        );


    const lineCtx =
        lineCanvas.getContext(
            '2d',
            {
                willReadFrequently: true
            }
        );


    const canvasFrame =
        document.getElementById(
            'canvasFrame'
        );


    const canvasStage =
        document.getElementById(
            'canvasStage'
        );


    const sourceImage =
        new Image();


    sourceImage.src =
        ARTWORK.source;



    /* =========================
       STATE
       ========================= */


    let currentTool =
        'fill';


    let currentColor =
        '#e88eaa';


    let brushSize =
        18;


    let drawing =
        false;


    let lastX =
        0;


    let lastY =
        0;


    let boundaryData =
        null;


    let history =
        [];


    let historyIndex =
        -1;


    const maxHistory =
        30;



    /* =========================
       VIEW STATE
       ========================= */


    let fitScale =
        1;


    let zoomMultiplier =
        1;


    let panX =
        0;


    let panY =
        0;


    const minZoom =
        1;


    const maxZoom =
        5;


    const activePointers =
        new Map();


    let pinchStartDistance =
        0;


    let pinchStartZoom =
        1;


    let panStartCenter =
        null;


    let panStartX =
        0;


    let panStartY =
        0;


    let navigationGesture =
        false;



    /* =========================
       COLORS
       ========================= */


    const COLORS = [

        '#e88eaa',
        '#f6b3c8',
        '#ef5350',
        '#ff9800',
        '#ffd54f',
        '#81c784',
        '#4dd0e1',
        '#64b5f6',
        '#9575cd',
        '#795548',
        '#222222',
        '#ffffff'

    ];



    function buildPalette(
        container
    ) {


        COLORS.forEach(
            function(color) {


                const button =
                    document.createElement(
                        'button'
                    );


                button.type =
                    'button';


                button.className =
                    'swatch';


                if (
                    color ===
                    currentColor
                ) {

                    button.classList.add(
                        'selected'
                    );

                }


                button.dataset.color =
                    color;


                button.style.background =
                    color;


                button.setAttribute(
                    'aria-label',
                    'Choose color ' +
                    color
                );


                button.addEventListener(
                    'click',
                    function(event) {


                        event.stopPropagation();


                        selectColor(
                            color
                        );

                    }
                );


                container.appendChild(
                    button
                );

            }
        );

    }



    document
        .querySelectorAll(
            '.desktop-palette, .mobile-palette'
        )
        .forEach(
            buildPalette
        );



    function selectColor(
        color
    ) {


        currentColor =
            color;


        document
            .querySelectorAll(
                '.swatch'
            )
            .forEach(
                function(swatch) {


                    swatch.classList.toggle(
                        'selected',
                        swatch.dataset.color ===
                        color
                    );

                }
            );

    }



    document
        .getElementById(
            'customColor'
        )
        .addEventListener(
            'input',
            function() {


                selectColor(
                    this.value
                );

            }
        );



    /* =========================
       INITIALIZE ART
       ========================= */


    sourceImage.onload =
        function() {


            const width =
                sourceImage.naturalWidth;


            const height =
                sourceImage.naturalHeight;


            paintCanvas.width =
                width;


            paintCanvas.height =
                height;


            lineCanvas.width =
                width;


            lineCanvas.height =
                height;


            canvasStage.style.width =
                width + 'px';


            canvasStage.style.height =
                height + 'px';


            /*
            Draw original source
            temporarily.
            */


            lineCtx.drawImage(
                sourceImage,
                0,
                0,
                width,
                height
            );


            /*
            Original pixels are kept
            for fill boundaries.
            */


            boundaryData =
                lineCtx.getImageData(
                    0,
                    0,
                    width,
                    height
                );


            /*
            Convert white background
            into transparency.

            Dark line art remains
            protected above paint.
            */


            const lineImage =
                lineCtx.getImageData(
                    0,
                    0,
                    width,
                    height
                );


            const pixels =
                lineImage.data;


            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {


                const r =
                    pixels[i];


                const g =
                    pixels[i + 1];


                const b =
                    pixels[i + 2];


                const darkness =
                    255 -
                    (
                        r +
                        g +
                        b
                    ) / 3;


                if (
                    darkness < 15
                ) {


                    pixels[
                        i + 3
                    ] = 0;


                } else {


                    pixels[i] = 0;

                    pixels[
                        i + 1
                    ] = 0;

                    pixels[
                        i + 2
                    ] = 0;


                    pixels[
                        i + 3
                    ] =
                        Math.min(
                            255,
                            darkness * 2.5
                        );

                }

            }


            lineCtx.clearRect(
                0,
                0,
                width,
                height
            );


            lineCtx.putImageData(
                lineImage,
                0,
                0
            );


            paintCtx.clearRect(
                0,
                0,
                width,
                height
            );


            saveHistory();


            requestAnimationFrame(
                fitArtwork
            );

    };



    /* =========================
       FIT / ZOOM / PAN
       ========================= */


    function fitArtwork() {


        if (
            !paintCanvas.width ||
            !paintCanvas.height
        ) {
            return;
        }


        const frameWidth =
            canvasFrame.clientWidth;


        const frameHeight =
            canvasFrame.clientHeight;


        const padding =
            28;


        fitScale =
            Math.min(

                (
                    frameWidth -
                    padding
                ) /
                paintCanvas.width,

                (
                    frameHeight -
                    padding
                ) /
                paintCanvas.height

            );


        zoomMultiplier =
            1;


        panX =
            0;


        panY =
            0;


        updateView();

    }



    function updateView() {


        const scale =
            fitScale *
            zoomMultiplier;


        canvasStage.style.transform =
            'translate(' +
            panX +
            'px,' +
            panY +
            'px)' +
            ' translate(-50%, -50%)' +
            ' scale(' +
            scale +
            ')';


        const readout =
            document.getElementById(
                'zoomReadout'
            );


        if (
            Math.abs(
                zoomMultiplier - 1
            ) < 0.01
        ) {

            readout.textContent =
                'FIT';

        } else {

            readout.textContent =
                Math.round(
                    zoomMultiplier *
                    100
                ) +
                '%';

        }

    }



    function setZoom(
        value
    ) {


        zoomMultiplier =
            Math.max(
                minZoom,
                Math.min(
                    maxZoom,
                    value
                )
            );


        if (
            zoomMultiplier === 1
        ) {

            panX = 0;

            panY = 0;

        }


        updateView();

    }



    document
        .getElementById(
            'zoomIn'
        )
        .addEventListener(
            'click',
            function() {


                setZoom(
                    zoomMultiplier *
                    1.25
                );

            }
        );



    document
        .getElementById(
            'zoomOut'
        )
        .addEventListener(
            'click',
            function() {


                setZoom(
                    zoomMultiplier /
                    1.25
                );

            }
        );



    document
        .getElementById(
            'fitButton'
        )
        .addEventListener(
            'click',
            fitArtwork
        );



    canvasFrame.addEventListener(
        'wheel',
        function(event) {


            event.preventDefault();


            if (
                event.deltaY < 0
            ) {

                setZoom(
                    zoomMultiplier *
                    1.1
                );

            } else {

                setZoom(
                    zoomMultiplier /
                    1.1
                );

            }

        },
        {
            passive: false
        }
    );



    window.addEventListener(
        'resize',
        function() {


            if (
                zoomMultiplier === 1
            ) {

                fitArtwork();

            }

        }
    );



    /* =========================
       TOOLS
       ========================= */


    function selectTool(
        tool
    ) {


        currentTool =
            tool;


        document
            .querySelectorAll(
                '[data-tool]'
            )
            .forEach(
                function(button) {


                    button.classList.toggle(
                        'active',
                        button.dataset.tool ===
                        tool
                    );

                }
            );


        const status =
            document.getElementById(
                'studioStatus'
            );


        if (
            tool === 'fill'
        ) {

            status.textContent =
                'Fill selected. Tap an area to fill it with color.';

        }


        if (
            tool === 'brush'
        ) {

            status.textContent =
                'Brush selected. Draw, doodle and create.';

        }


        if (
            tool === 'eraser'
        ) {

            status.textContent =
                'Eraser selected. Remove anything you added.';

        }

    }



    document
        .querySelectorAll(
            '[data-tool]'
        )
        .forEach(
            function(button) {


                button.addEventListener(
                    'click',
                    function() {


                        selectTool(
                            this.dataset.tool
                        );

                    }
                );

            }
        );



    /* =========================
       BRUSH SIZE
       ========================= */


    const brushSlider =
        document.getElementById(
            'brushSize'
        );


    brushSlider.addEventListener(
        'input',
        function() {


            brushSize =
                Number(
                    this.value
                );


            document
                .getElementById(
                    'brushReadout'
                )
                .textContent =
                    brushSize;

        }
    );



    /* =========================
       CANVAS COORDINATES
       ========================= */


    function getCanvasPoint(
        event
    ) {


        const rect =
            paintCanvas
                .getBoundingClientRect();


        return {

            x:
                Math.max(
                    0,
                    Math.min(
                        paintCanvas.width - 1,

                        Math.floor(
                            (
                                event.clientX -
                                rect.left
                            ) *
                            paintCanvas.width /
                            rect.width
                        )
                    )
                ),

            y:
                Math.max(
                    0,
                    Math.min(
                        paintCanvas.height - 1,

                        Math.floor(
                            (
                                event.clientY -
                                rect.top
                            ) *
                            paintCanvas.height /
                            rect.height
                        )
                    )
                )

        };

    }



    /* =========================
       POINTER HELPERS
       ========================= */


    function pointerCenter() {


        const points =
            Array.from(
                activePointers.values()
            );


        if (
            points.length < 2
        ) {
            return null;
        }


        return {

            x:
                (
                    points[0].x +
                    points[1].x
                ) / 2,

            y:
                (
                    points[0].y +
                    points[1].y
                ) / 2

        };

    }



    function pointerDistance() {


        const points =
            Array.from(
                activePointers.values()
            );


        if (
            points.length < 2
        ) {
            return 0;
        }


        return Math.hypot(

            points[1].x -
            points[0].x,

            points[1].y -
            points[0].y

        );

    }



    /* =========================
       POINTER DOWN
       ========================= */


    paintCanvas.addEventListener(
        'pointerdown',
        function(event) {


            event.preventDefault();


            activePointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            try {

                paintCanvas
                    .setPointerCapture(
                        event.pointerId
                    );

            } catch (error) {
            }


            /*
            Two fingers switch
            immediately into
            navigation mode.
            */


            if (
                activePointers.size >= 2
            ) {


                drawing =
                    false;


                navigationGesture =
                    true;


                pinchStartDistance =
                    pointerDistance();


                pinchStartZoom =
                    zoomMultiplier;


                panStartCenter =
                    pointerCenter();


                panStartX =
                    panX;


                panStartY =
                    panY;


                return;

            }


            navigationGesture =
                false;


            const point =
                getCanvasPoint(
                    event
                );


            if (
                currentTool === 'fill'
            ) {


                floodFill(
                    point.x,
                    point.y,
                    currentColor
                );


                saveHistory();

                return;

            }


            drawing =
                true;


            lastX =
                point.x;


            lastY =
                point.y;


            drawStroke(
                lastX,
                lastY,
                lastX,
                lastY
            );

        }
    );



    /* =========================
       POINTER MOVE
       ========================= */


    paintCanvas.addEventListener(
        'pointermove',
        function(event) {


            if (
                activePointers.has(
                    event.pointerId
                )
            ) {


                activePointers.set(
                    event.pointerId,
                    {
                        x: event.clientX,
                        y: event.clientY
                    }
                );

            }


            if (
                activePointers.size >= 2
            ) {


                event.preventDefault();


                navigationGesture =
                    true;


                const distance =
                    pointerDistance();


                if (
                    pinchStartDistance > 0
                ) {


                    zoomMultiplier =
                        Math.max(
                            minZoom,
                            Math.min(
                                maxZoom,

                                pinchStartZoom *
                                (
                                    distance /
                                    pinchStartDistance
                                )
                            )
                        );

                }


                const center =
                    pointerCenter();


                if (
                    center &&
                    panStartCenter
                ) {


                    panX =
                        panStartX +
                        (
                            center.x -
                            panStartCenter.x
                        );


                    panY =
                        panStartY +
                        (
                            center.y -
                            panStartCenter.y
                        );

                }


                updateView();

                return;

            }


            if (
                !drawing ||
                navigationGesture
            ) {
                return;
            }


            event.preventDefault();


            const point =
                getCanvasPoint(
                    event
                );


            drawStroke(
                lastX,
                lastY,
                point.x,
                point.y
            );


            lastX =
                point.x;


            lastY =
                point.y;

        }
    );



    /* =========================
       POINTER END
       ========================= */


    function endPointer(
        event
    ) {


        activePointers.delete(
            event.pointerId
        );


        if (
            activePointers.size <
            2
        ) {

            pinchStartDistance =
                0;

            panStartCenter =
                null;

        }


        if (
            drawing
        ) {


            drawing =
                false;


            saveHistory();

        }


        if (
            activePointers.size === 0
        ) {

            navigationGesture =
                false;

        }

    }



    paintCanvas.addEventListener(
        'pointerup',
        endPointer
    );


    paintCanvas.addEventListener(
        'pointercancel',
        endPointer
    );



    /* =========================
       BRUSH + ERASER
       ========================= */


    function drawStroke(
        x1,
        y1,
        x2,
        y2
    ) {


        paintCtx.save();


        paintCtx.lineCap =
            'round';


        paintCtx.lineJoin =
            'round';


        paintCtx.lineWidth =
            brushSize;


        if (
            currentTool ===
            'eraser'
        ) {


            paintCtx.globalCompositeOperation =
                'destination-out';


            paintCtx.strokeStyle =
                '#000';


            paintCtx.fillStyle =
                '#000';


        } else {


            paintCtx.globalCompositeOperation =
                'source-over';


            paintCtx.strokeStyle =
                currentColor;


            paintCtx.fillStyle =
                currentColor;

        }


        paintCtx.beginPath();


        paintCtx.moveTo(
            x1,
            y1
        );


        paintCtx.lineTo(
            x2,
            y2
        );


        paintCtx.stroke();


        paintCtx.beginPath();


        paintCtx.arc(
            x2,
            y2,
            brushSize / 2,
            0,
            Math.PI * 2
        );


        paintCtx.fill();


        paintCtx.restore();

    }



    /* =========================
       FILL HELPERS
       ========================= */


    function hexToRGB(
        hex
    ) {


        hex =
            hex.replace(
                '#',
                ''
            );


        return {

            r:
                parseInt(
                    hex.substring(
                        0,
                        2
                    ),
                    16
                ),

            g:
                parseInt(
                    hex.substring(
                        2,
                        4
                    ),
                    16
                ),

            b:
                parseInt(
                    hex.substring(
                        4,
                        6
                    ),
                    16
                )

        };

    }



    function isBoundaryPixel(
        index
    ) {


        const data =
            boundaryData.data;


        return (

            data[index] < 150 &&

            data[
                index + 1
            ] < 150 &&

            data[
                index + 2
            ] < 150

        );

    }



    /* =========================
       FLOOD FILL
       ========================= */


    function floodFill(
        startX,
        startY,
        fillHex
    ) {


        if (
            !boundaryData
        ) {
            return;
        }


        const width =
            paintCanvas.width;


        const height =
            paintCanvas.height;


        const startPosition =
            startY *
            width +
            startX;


        if (
            isBoundaryPixel(
                startPosition * 4
            )
        ) {
            return;
        }


        const image =
            paintCtx.getImageData(
                0,
                0,
                width,
                height
            );


        const data =
            image.data;


        const startIndex =
            startPosition * 4;


        const target = {

            r:
                data[
                    startIndex
                ],

            g:
                data[
                    startIndex + 1
                ],

            b:
                data[
                    startIndex + 2
                ],

            a:
                data[
                    startIndex + 3
                ]

        };


        const fill =
            hexToRGB(
                fillHex
            );


        if (

            target.a === 255 &&

            Math.abs(
                target.r -
                fill.r
            ) < 5 &&

            Math.abs(
                target.g -
                fill.g
            ) < 5 &&

            Math.abs(
                target.b -
                fill.b
            ) < 5

        ) {
            return;
        }


        const visited =
            new Uint8Array(
                width *
                height
            );


        const stack =
            [
                [
                    startX,
                    startY
                ]
            ];


        function matches(
            position
        ) {


            if (
                visited[
                    position
                ]
            ) {
                return false;
            }


            if (
                isBoundaryPixel(
                    position * 4
                )
            ) {
                return false;
            }


            const index =
                position * 4;


            if (
                target.a === 0
            ) {

                return (
                    data[
                        index + 3
                    ] === 0
                );

            }


            return (

                data[
                    index + 3
                ] ===
                target.a &&

                Math.abs(
                    data[index] -
                    target.r
                ) < 10 &&

                Math.abs(
                    data[
                        index + 1
                    ] -
                    target.g
                ) < 10 &&

                Math.abs(
                    data[
                        index + 2
                    ] -
                    target.b
                ) < 10

            );

        }


        function colorPixel(
            position
        ) {


            const index =
                position * 4;


            data[index] =
                fill.r;


            data[
                index + 1
            ] =
                fill.g;


            data[
                index + 2
            ] =
                fill.b;


            data[
                index + 3
            ] =
                255;


            visited[
                position
            ] =
                1;

        }


        while (
            stack.length
        ) {


            const point =
                stack.pop();


            const x =
                point[0];


            let y =
                point[1];


            if (

                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height

            ) {
                continue;
            }


            let position =
                y *
                width +
                x;


            while (

                y >= 0 &&

                matches(
                    position
                )

            ) {


                y--;

                position -=
                    width;

            }


            y++;

            position +=
                width;


            let reachLeft =
                false;


            let reachRight =
                false;


            while (

                y < height &&

                matches(
                    position
                )

            ) {


                colorPixel(
                    position
                );


                if (
                    x > 0
                ) {


                    const left =
                        position - 1;


                    if (
                        matches(
                            left
                        )
                    ) {


                        if (
                            !reachLeft
                        ) {


                            stack.push(
                                [
                                    x - 1,
                                    y
                                ]
                            );


                            reachLeft =
                                true;

                        }


                    } else {


                        reachLeft =
                            false;

                    }

                }


                if (
                    x <
                    width - 1
                ) {


                    const right =
                        position + 1;


                    if (
                        matches(
                            right
                        )
                    ) {


                        if (
                            !reachRight
                        ) {


                            stack.push(
                                [
                                    x + 1,
                                    y
                                ]
                            );


                            reachRight =
                                true;

                        }


                    } else {


                        reachRight =
                            false;

                    }

                }


                y++;

                position +=
                    width;

            }

        }


        paintCtx.putImageData(
            image,
            0,
            0
        );

    }



    /* =========================
       HISTORY
       ========================= */


    function saveHistory() {


        history =
            history.slice(
                0,
                historyIndex + 1
            );


        history.push(

            paintCtx.getImageData(
                0,
                0,
                paintCanvas.width,
                paintCanvas.height
            )

        );


        if (
            history.length >
            maxHistory
        ) {

            history.shift();

        }


        historyIndex =
            history.length - 1;

    }



    function restoreHistory() {


        paintCtx.clearRect(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        );


        paintCtx.putImageData(
            history[
                historyIndex
            ],
            0,
            0
        );

    }



    function undo() {


        if (
            historyIndex <= 0
        ) {
            return;
        }


        historyIndex--;

        restoreHistory();

    }



    function redo() {


        if (
            historyIndex >=
            history.length - 1
        ) {
            return;
        }


        historyIndex++;

        restoreHistory();

    }



    /* =========================
       RESET
       ========================= */


    function resetArtwork() {


        const okay =
            confirm(
                'Start over with a clean page?'
            );


        if (
            !okay
        ) {
            return;
        }


        paintCtx.clearRect(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        );


        history = [];

        historyIndex = -1;

        saveHistory();


        fitArtwork();

    }



    /* =========================
       EXPORT
       ========================= */


    function createFinishedArtwork() {


        const output =
            document.createElement(
                'canvas'
            );


        output.width =
            paintCanvas.width;


        output.height =
            paintCanvas.height;


        const outputCtx =
            output.getContext(
                '2d'
            );


        /*
        White paper.
        */


        outputCtx.fillStyle =
            '#ffffff';


        outputCtx.fillRect(
            0,
            0,
            output.width,
            output.height
        );


        /*
        User-created artwork.
        */


        outputCtx.drawImage(
            paintCanvas,
            0,
            0
        );


        /*
        Protected line art.
        */


        outputCtx.drawImage(
            lineCanvas,
            0,
            0
        );


        return output;

    }



    function saveArtwork() {


        const finished =
            createFinishedArtwork();


        const link =
            document.createElement(
                'a'
            );


        link.download =
            'my-' +
            ARTWORK.id +
            '-art.png';


        link.href =
            finished.toDataURL(
                'image/png'
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }



    /* =====================================================
       FUTURE API HANDOFF
       =====================================================

       We intentionally keep external commerce
       OUT of the kids' coloring experience.

       Later, an adult-facing page can receive
       the finished image from this studio.

       This function already gives us a Blob,
       which is what a secure backend/API
       will eventually need.

       No Printful or third-party API keys
       should ever be placed in this file.

       ===================================================== */


    async function getArtworkBlob() {


        const finished =
            createFinishedArtwork();


        return new Promise(
            function(resolve) {


                finished.toBlob(
                    function(blob) {


                        resolve(
                            blob
                        );

                    },
                    'image/png'
                );

            }
        );

    }



    /*
    FUTURE EXAMPLE:

    const artworkBlob =
        await getArtworkBlob();

    Send artworkBlob to OUR secure
    backend.

    The backend can then communicate
    with Printful or another provider.

    Nothing commerce-related is
    activated here.
    */



    /* =========================
       BUTTON CONNECTIONS
       ========================= */


    [
        'undoDesktop',
        'undoMobile'
    ].forEach(
        function(id) {


            document
                .getElementById(
                    id
                )
                .addEventListener(
                    'click',
                    undo
                );

        }
    );


    [
        'redoDesktop',
        'redoMobile'
    ].forEach(
        function(id) {


            document
                .getElementById(
                    id
                )
                .addEventListener(
                    'click',
                    redo
                );

        }
    );


    [
        'resetDesktop',
        'resetMobile'
    ].forEach(
        function(id) {


            document
                .getElementById(
                    id
                )
                .addEventListener(
                    'click',
                    resetArtwork
                );

        }
    );


    [
        'saveDesktop',
        'saveMobile'
    ].forEach(
        function(id) {


            document
                .getElementById(
                    id
                )
                .addEventListener(
                    'click',
                    saveArtwork
                );

        }
    );


</script>
