<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alex Reynoso Art</title>

    <meta name="description"
          content="Alex Reynoso Art, original art, animation, videos, characters and creative projects.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <a class="site-logo" href="index.html">
            <img src="images/AlexReynosoArt-Logo_transparent.png"
                 alt="Alex Reynoso Art">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="art.html">Art</a>
            <a href="videos.html">Videos</a>
            <a href="shop.html">Shop</a>
            <a href="commissions.html">Commissions</a>
        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="hello">

                <div class="hello-main">HELLO</div>

                <div class="hello-translation"
                     id="helloTranslation">
                    Hola
                </div>

            </div>


            <p class="hero-tagline">
                Art. Animation. Characters. Controlled chaos.
            </p>

        </section>

    </main>

    <footer>
        &copy; 2026 Alex Reynoso Art
    </footer>


    <script>

        const greetings = [
            "Hola",
            "Bonjour",
            "Ciao",
            "Hallo",
            "Olá",
            "Hej",
            "Hei",
            "Halló",
            "こんにちは",
            "안녕하세요",
            "你好",
            "مرحبا",
            "नमस्ते"
        ];

        const helloTranslation =
            document.getElementById("helloTranslation");

        let lastGreeting = -1;

        function changeGreeting() {

            let newGreeting;

            do {
                newGreeting =
                    Math.floor(Math.random() * greetings.length);
            }
            while (newGreeting === lastGreeting);

            helloTranslation.style.opacity = 0;

            setTimeout(function() {

                helloTranslation.textContent =
                    greetings[newGreeting];

                helloTranslation.style.opacity = 1;

                lastGreeting = newGreeting;

            }, 500);
        }

        changeGreeting();

setInterval(changeGreeting, 5000);

    </script>

</body>

</html>
